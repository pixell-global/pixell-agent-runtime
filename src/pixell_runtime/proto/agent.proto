syntax = "proto3";

package pixell.agent;

// Empty message for simple requests
message Empty {}

// Health status response
message HealthStatus {
  bool ok = 1;
  string message = 2;
  int64 timestamp = 3;
}

// Agent capabilities
message Capabilities {
  repeated string methods = 1;
  map<string, string> metadata = 2;
}

// A2A (Agent-to-Agent) message structure
// Follows JSON-RPC 2.0 specification with A2A extensions
message A2AMessage {
  string jsonrpc = 1;        // JSON-RPC version (must be "2.0")
  string id = 2;             // Request ID (UUID)
  string method = 3;         // Method name (e.g., "message/send")
  string params_json = 4;    // JSON-encoded params containing the message
}

// Action request
// Supports both legacy format (action/parameters) and new A2A format (message)
message ActionRequest {
  // Legacy fields (deprecated, kept for backward compatibility)
  string action = 1;
  map<string, string> parameters = 2;
  string request_id = 3;

  // New A2A format field
  A2AMessage message = 4;
}

// Action result
message ActionResult {
  bool success = 1;
  string result = 2;
  string error = 3;
  string request_id = 4;
  int64 duration_ms = 5;
  map<string, string> metadata = 6;  // Metadata for UI rendering and additional context
}

// Ping response
message Pong {
  string message = 1;
  int64 timestamp = 2;
}

// A2A service definition
service AgentService {
  // Health check
  rpc Health(Empty) returns (HealthStatus);
  
  // Describe agent capabilities
  rpc DescribeCapabilities(Empty) returns (Capabilities);
  
  // Invoke an action
  rpc Invoke(ActionRequest) returns (ActionResult);
  
  // Simple ping
  rpc Ping(Empty) returns (Pong);
}
